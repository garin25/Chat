name: Deploy a Producción 🚀

on:
  push:
    branches: [ "master" ] 
    # Extra pro: Esto hace que solo se ejecute si tocás algo del backend
    paths:
      - 'back/**'
      - '.github/workflows/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest 

    # Le decimos que por defecto ejecute los comandos de consola adentro de /back
    defaults:
      run:
        working-directory: ./back

    steps:
    - name: 📥 Descargar el código
      uses: actions/checkout@v3

    - name: ☕ Configurar Java 17
      uses: actions/setup-java@v3
      with:
        java-version: '17' 
        distribution: 'temurin'

    - name: 📦 Compilar el .jar con Maven
      run: mvn clean package -DskipTests

    - name: 🐳 Login en Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 🚀 Build y Push de la imagen Docker
      uses: docker/build-push-action@v4
      with:
        # ¡Súper importante! Le decimos a Docker que el Dockerfile está en /back
        context: ./back 
        push: true
        tags: |
          garin25/mi-backend:latest
          garin25/mi-backend:${{ github.sha }}

    - name: 🔄 Avisar a Render para que actualice
      # Al sacar esto de 'defaults', le decimos que lo corra donde sea, total es solo hacer una llamada web
      working-directory: .
      run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}