version: '3.8'
services:
  # Solo la base de datos
  db:
    image: postgres:15
    container_name: postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: wsp
    ports:
      - "5432:5432" # Expuesto para que tu Java local pueda entrar
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

volumes:
  postgres_data_dev: