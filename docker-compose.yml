services:
  db:
    image: postgres:15
    container_name: chat-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=wsp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wsp"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  cache:
    image: redis:7-alpine
    container_name: redis-dev
    ports:
      - "6379:6379"
  backend:
    build: 
      context: ./back # Aquí le decimos: "Entrá a la carpeta 'back'"
      dockerfile: Dockerfile # "Y ahí buscá el Dockerfile"
    container_name: chat-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/wsp
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JWT_SECRET=UnaClaveSuperSecreta123
      - TZ=America/Argentina/Buenos_Aires
    depends_on:
      db:
        condition: service_healthy